name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ mainr ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [latest]
    
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
    - run: npm ci
    - name: Build
      run: |
        npm run build
